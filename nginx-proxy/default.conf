# ==============================================================
# KONFIGURASI NGINX REVERSE PROXY UNTUK CBT WIDYATAMA
# ==============================================================

# 1. Redirect HTTP ke HTTPS secara paksa
server {
    listen 80;
    server_name cbt.widyatama.ac.id api.cbt.widyatama.ac.id admin.cbt.widyatama.ac.id;
    
    # Let's Encrypt / Certbot challenge (jangan dihapus)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Frontend Portal Mahasiswa (Next.js)
server {
    listen 443 ssl http2;
    server_name cbt.widyatama.ac.id;

    # Path ke SSL Certificate (Dibuat otomatis oleh Certbot nanti)
    ssl_certificate /etc/letsencrypt/live/cbt.widyatama.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cbt.widyatama.ac.id/privkey.pem;
    
    # Hardening Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://frontend-toefl:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Backend REST API (AdonisJS)
server {
    listen 443 ssl http2;
    server_name api.cbt.widyatama.ac.id;

    ssl_certificate /etc/letsencrypt/live/cbt.widyatama.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cbt.widyatama.ac.id/privkey.pem;

    # Limitasi upload foto snapshot/identitas (Max 5MB)
    client_max_body_size 5M;

    location / {
        proxy_pass http://backend:3333;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Konfigurasi khusus untuk SSE (Server-Sent Events) Live Monitoring
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# 4. CMS Admin Dashboard (React Vite)
server {
    listen 443 ssl http2;
    server_name admin.cbt.widyatama.ac.id;

    ssl_certificate /etc/letsencrypt/live/cbt.widyatama.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cbt.widyatama.ac.id/privkey.pem;

    location / {
        proxy_pass http://cms-admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
